<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Search and discover movies easily with this movie finder app.">
    <meta name="keywords" content="movies, film search, cinema, movie finder, film database">
    <meta name="author" content="developer">
    <meta name="robots" content="index, follow">
    <title>Movie Search</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="src/node.js" defer></script>
    <script src="src/utils.js" defer></script>
    <script src="src/api.js" defer></script>
    <script src="src/navigator.js" defer></script>
    <script src="src/index.js" defer></script>
</head>
<body>

    <header 
    class="header-section"
    id="header-section"
    >
        <h1
        class="header-section__text-title text--primary-bold"
        id="header-section-text-title"
        >Movie Search</h1>

        <form
        class="header-section__form-search"
        id="header-section-form-search"
        >
            <input 
            class="form-search__input-search text--secondary-bold"
            id="form-search-input-search"
            placeholder="name movie..."
            type="search"
            >
            <input 
            class="form-search__input-submit"
            id="form-search-input-submit"
            type="submit" 
            value="&#128269;"
            >
        </form>
    </header>


    <section
    class="trending-section"
    id="trending-section"
    >
        <h2
        class="trending-section__text-title text--secondary-bold"
        id="trending-section-text-title"
        >Trendings</h2>

        <button
        class="trending-section__button-more text--secondary-bold"
        id="trending-section-button-more"
        >See more</button>

        <article
        class="trending-section__container-movies"
        id="trending-section-container-movies"
        >

            <!-- <figure
            class="container-movies__figure-movie"
            >
                <img 
                class="figure-movie__img-movie"
                src="https://www.washingtonpost.com/graphics/2019/entertainment/oscar-nominees-movie-poster-design/img/black-panther-web.jpg" 
                alt="img movie"
                >

            </figure> -->


        </article>

    </section>




    <section
    class="categories-section"
    id="categories-section"
    >
        <h2
        class="categories-section__text-title text--secondary-bold"
        id="categories-section-text-title"
        >Categories</h2>
        <ul
        class="categories-section__list-categories"
        id="categories-section-list-categories"
        >


        </ul>
    </section>

</body>
</html>
